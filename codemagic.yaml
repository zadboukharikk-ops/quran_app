workflows:
  default-workflow:
    name: Build Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Fix Android Folder
        script: |
          flutter create . --platforms android
      - name: Build Flutter APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk